<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Marker DS preview</title>
<style>
  body { margin: 0; background: #cfe3c8; font-family: Inter, Arial, sans-serif; color: #1b2430; }
  .wrap { padding: 28px 32px; }
  h2 { font-size: 16px; margin: 26px 0 10px; }
  .row { display: flex; gap: 54px; align-items: flex-end; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cap { font-size: 12px; font-weight: 700; }
  .sub { font-size: 11px; opacity: .7; }
  /* маркер-обёртка как в приложении */
  .order-marker { display:inline-block; position:relative; }
  .order-marker__pin { display:block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .order-marker__timer {
    position:absolute; left:50%; top:50px; transform:translateX(-50%);
    padding:1px 6px; border-radius:8px; font-size:11px; line-height:14px;
    font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;
    color:#fff; background:rgba(27,36,48,.92); box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .order-marker__timer--up { background:rgba(33,150,243,.95); }
  .order-marker__timer--urgent { background:rgba(229,57,53,.96); }
  .scale4 { transform: scale(4); transform-origin: bottom center; margin: 36px 60px 70px; }
  .scale2 { transform: scale(2); transform-origin: bottom center; margin: 18px 24px 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h2>1. Ножка маркера: было (толстая) → стало (тонкая, как в ДС §5/§6)</h2>
  <div class="row" id="legs"></div>

  <h2>2. Три режима таймера (vote/offer убывают, direct растёт) + кольцо §6</h2>
  <div class="row" id="modes"></div>

  <h2>Кольцо офера во всех цветах §6 (100% → 8%)</h2>
  <div class="row" id="rings"></div>
</div>

<script>
const DS = { beige:'#F2E7C9', purple:'#7B61FF', yellow:'#FFC107', green:'#2EAF5B',
  grey:'#9AA0A6', red:'#E53935', ink:'#2b2b2b', orange:'#FB8C00', blue:'#2196F3' };

const OLD_PATH = "M24 49 C 16 33 12 29 12 19 A 12 12 0 1 1 36 19 C 36 29 32 33 24 49 Z";
const NEW_PATH = "M20.9 30.6 A 12 12 0 1 1 27.1 30.6 Q 25.6 40.5 24 49 Q 22.4 40.5 20.9 30.6 Z";

function typeGlyph(t){
  if(t==='delivery') return "<g><rect x='18.5' y='13.5' width='11' height='11' rx='1.5' fill='"+DS.blue+"' stroke='"+DS.ink+"' stroke-width='1'/><path d='M24 13.5 L24 24.5 M18.5 19 L29.5 19' fill='none' stroke='#fff' stroke-width='1.2' stroke-opacity='0.9'/></g>";
  if(t==='marshrutka') return "<path d='M24 12 L30 15.5 L30 22.5 L24 26 L18 22.5 L18 15.5 Z' fill='none' stroke='"+DS.ink+"' stroke-width='2'/>";
  return "<g fill='none' stroke='"+DS.ink+"' stroke-width='2' stroke-linecap='round'><circle cx='24' cy='15.5' r='2.6'/><path d='M19.5 25 C19.5 20 28.5 20 28.5 25'/></g>";
}
function statusBadge(mark,color){
  if(!mark) return '';
  const ring="<circle cx='34' cy='25' r='7.5' fill='#fff' stroke='"+color+"' stroke-width='1.5'/>";
  if(mark==='check') return ring+"<path d='M30.5 25 L33 27.5 L38 21' fill='none' stroke='"+color+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>";
  if(mark==='double') return ring+"<g fill='none' stroke='"+color+"' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M29 25 L31.3 27.5 L34.8 21.5'/><path d='M33.2 25 L35.5 27.5 L39 21'/></g>";
  return ring+"<path d='M31 22 L37 28 M37 22 L31 28' stroke='"+color+"' stroke-width='2' stroke-linecap='round'/>";
}
function ringColor(rem){ if(rem>80)return DS.green; if(rem>40)return DS.yellow; if(rem>12)return DS.orange; return DS.red; }
function offerRing(agePct){
  const rem=Math.min(100,Math.max(0,100-agePct)); const r=10; const c=2*Math.PI*r; const dash=(rem/100)*c;
  const track="<circle cx='24' cy='19' r='"+r+"' fill='none' stroke='rgba(43,43,43,0.18)' stroke-width='2'/>";
  const arc="<circle cx='24' cy='19' r='"+r+"' fill='none' stroke='"+ringColor(rem)+"' stroke-width='2' stroke-linecap='round' stroke-dasharray='"+dash.toFixed(2)+" "+c.toFixed(2)+"' transform='rotate(-90 24 19)'/>";
  return track+arc;
}
function pinSvg(path, color, inner){
  return "<svg class='order-marker__pin' width='48' height='52' viewBox='0 0 48 52' xmlns='http://www.w3.org/2000/svg'>"+
    "<path d='"+path+"' fill='"+color+"' stroke='"+DS.ink+"' stroke-width='1' stroke-linejoin='round' stroke-linecap='round'/>"+
    (inner||'')+"</svg>";
}
function marker(opts){
  const {path=NEW_PATH,color,type,mark,markColor,agePct,timer,timerClass}=opts;
  const inner = (agePct!=null?offerRing(agePct):'') + typeGlyph(type) + (mark?statusBadge(mark,markColor):'');
  const t = timer ? "<div class='order-marker__timer "+(timerClass||'')+"'>"+timer+"</div>" : '';
  return "<div class='order-marker'>"+pinSvg(path,color,inner)+t+"</div>";
}
function cell(html, cap, sub, cls){
  return "<div class='cell'><div class='"+(cls||'scale4')+"'>"+html+"</div><div class='cap'>"+cap+"</div>"+(sub?"<div class='sub'>"+sub+"</div>":'')+"</div>";
}

// Row 1: legs old vs new (bare beige pin, no overlays, to isolate the leg)
document.getElementById('legs').innerHTML =
  cell(marker({path:OLD_PATH,color:DS.beige,type:'passenger'}), 'БЫЛО', 'толстая ножка-конус') +
  cell(marker({path:NEW_PATH,color:DS.beige,type:'passenger'}), 'СТАЛО', 'тонкая ножка / капля') +
  cell(marker({path:OLD_PATH,color:DS.orange,type:'passenger'}), 'было (цвет)', '', 'scale2') +
  cell(marker({path:NEW_PATH,color:DS.orange,type:'passenger'}), 'стало (цвет)', '', 'scale2');

// Row 2: three modes
document.getElementById('modes').innerHTML =
  cell(marker({color:DS.yellow,type:'passenger',mark:'check',markColor:DS.yellow,agePct:25,timer:'3:45'}), 'VOTE', 'голосование · убывает ↓') +
  cell(marker({color:DS.purple,type:'delivery',mark:'check',markColor:DS.purple,agePct:70,timer:'2:58'}), 'OFFER', 'оффер · кольцо убывает ↓') +
  cell(marker({color:DS.beige,type:'passenger',agePct:null,timer:'+0:07',timerClass:'order-marker__timer--up'}), 'DIRECT', 'прямой · ждёт ↑ (без кольца)') +
  cell(marker({color:DS.beige,type:'marshrutka',agePct:92,timer:'0:12',timerClass:'order-marker__timer--urgent'}), 'VOTE ~0', 'скоро исчезнет');

// Row 3: ring colors
document.getElementById('rings').innerHTML =
  cell(marker({color:DS.beige,type:'passenger',agePct:0}),  '100%','много времени','scale2') +
  cell(marker({color:DS.yellow,type:'passenger',mark:'check',markColor:DS.yellow,agePct:25}), '75%','достаточно','scale2') +
  cell(marker({color:DS.purple,type:'delivery',mark:'check',markColor:DS.purple,agePct:70}), '30%','мало','scale2') +
  cell(marker({color:DS.beige,type:'delivery',agePct:92}), '8%','скоро исчезнет','scale2');
</script>
</body>
</html>
